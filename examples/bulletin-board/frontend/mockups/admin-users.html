<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&amp;family=DM+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F2F1EC;color:#17181A;font-family:"Zen Kaku Gothic New","Hiragino Sans",system-ui,sans-serif;font-size:16px;line-height:1.7}
a{color:#17181A}
h1,h2,h3,p{margin:0}
.mono{font-family:"DM Mono",ui-monospace,Menlo,monospace;font-size:.88em;letter-spacing:.02em}
.wrap{max-width:760px;margin:0 auto;padding:0 20px;box-sizing:border-box;width:100%}
.ic{width:18px;height:18px;flex:none}
.wordmark{display:inline-flex;align-items:center;gap:10px;font-weight:900;font-size:18px;letter-spacing:.04em;text-decoration:none;color:#17181A;min-height:44px}
.wordmark i{width:12px;height:12px;background:#C8311F;border-radius:2px;display:inline-block}
.nav{display:flex;gap:4px 22px;flex-wrap:wrap}
.nav a{display:inline-flex;align-items:center;min-height:44px;font-weight:700;font-size:15px;text-decoration:none;color:#6E7177;border-bottom:3px solid transparent}
.nav a.on{color:#17181A;border-bottom-color:#17181A}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:4px;border:1.5px solid #17181A;background:#17181A;color:#F2F1EC;font:inherit;font-weight:700;cursor:pointer;text-decoration:none;box-sizing:border-box;white-space:nowrap}
.btn.line{background:transparent;color:#17181A}
.btn.red{background:transparent;color:#C8311F;border-color:#C8311F}
.btn.plain{border-color:transparent;background:transparent;color:#4A4D52;font-weight:500}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
.tag{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 7px;border:1.5px solid currentColor;border-radius:2px;font-size:12px;font-weight:700;line-height:1;letter-spacing:.08em;white-space:nowrap}
.tag.admin{color:#C8311F}
.who{display:inline-flex;align-items:center;gap:10px;text-decoration:none;color:#17181A;min-height:44px;font-weight:700;font-size:14px}
.avatar{width:32px;height:32px;border-radius:50%;background:#17181A;color:#F2F1EC;display:inline-flex;align-items:center;justify-content:center;font-family:"DM Mono",ui-monospace,Menlo,monospace;font-size:13px;flex:none;box-sizing:border-box}
.avatar.admin{background:#C8311F}
.avatar.big{width:56px;height:56px;font-size:20px}
.sheet{background:#FFFFFF;border-top:3px solid #17181A;padding:28px 32px;box-sizing:border-box}
.input{font:inherit;min-height:48px;padding:10px 0;border:0;border-bottom:1.5px solid #17181A;background:transparent;width:100%;box-sizing:border-box;color:#17181A;border-radius:0}
.input::placeholder{color:#B3B5B8}
.stamp{display:inline-block;padding:6px 14px;border:2px solid #1F7A3E;border-radius:6px;color:#1F7A3E;font-weight:900;font-size:16px;letter-spacing:.18em;line-height:1.2;transform:rotate(-5deg);box-shadow:inset 0 0 0 2px #FFFFFF,inset 0 0 0 3px #1F7A3E;background:rgba(255,255,255,.9);white-space:nowrap}
</style>
</head>
<body>
<div style="display: flex; flex-direction: column; min-height: 100vh; background: #F2F1EC">
<header class="wrap" style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 28px; padding-top: 20px">
  <a class="wordmark" href="post-list-anonymous.html"><i></i>Nyxis Board</a>
  <nav class="nav" aria-label="Menu">
    <a href="post-list-admin.html">Home</a>
    <a href="post-create.html">New post</a>
    <a class="on" href="admin-users.html">Admin</a>
  </nav>
  <div style="margin-left: auto; display: flex; flex-wrap: wrap; align-items: center; gap: 16px">
    <a class="who" href="me.html" aria-label="Signed in as admin 6c0fe2a1"><span class="avatar admin">6c</span><span class="tag admin">Admin</span></a>
    <button class="btn plain sm" type="button">Sign out</button>
  </div>
</header>
<div class="wrap"><div style="border-top: 3px solid #17181A; margin-top: 8px"></div></div>
<main class="wrap" style="flex: 1; display: flex; flex-direction: column; gap: 28px; padding-top: 36px; padding-bottom: 56px">
  <h1 style="font-size: 34px; font-weight: 900; line-height: 1.2; letter-spacing: .02em">Admin</h1>
  <form style="display: flex; align-items: flex-end; gap: 12px; max-width: 560px">
    <div style="flex: 1; display: flex; flex-direction: column; gap: 4px">
      <label for="lookup-id" style="font-size: 12px; font-weight: 700; letter-spacing: .1em; color: #6E7177">ID</label>
      <input class="input mono" id="lookup-id" type="text" value="b7d104af-2e6c-4f19-8d3a-5c7e9b1a2f40">
    </div>
    <button class="btn line" type="button">Look up</button>
  </form>
  <section class="sheet" style="display: flex; flex-wrap: wrap; align-items: center; gap: 20px 24px; position: relative">
    <span class="avatar big admin">b7</span>
    <div style="display: flex; flex-direction: column; gap: 6px; flex: 1 1 300px; min-width: 0">
      <div style="display: flex; align-items: center; gap: 12px"><span class="tag admin">Admin</span><span class="stamp" role="status">Done</span></div>
      <span class="mono" style="word-break: break-all; color: #4A4D52">b7d104af-2e6c-4f19-8d3a-5c7e9b1a2f40</span>
    </div>
    <button class="btn red" type="button">Remove admin</button>
  </section>
</main>
</div>
</body>
</html>
