<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>モバイル 見られません</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&amp;family=DM+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F2F1EC;color:#17181A;font-family:"Zen Kaku Gothic New","Hiragino Sans",system-ui,sans-serif;font-size:16px;line-height:1.7}
a{color:#17181A}
h1,h2,h3,p{margin:0}
.mono{font-family:"DM Mono",ui-monospace,Menlo,monospace;font-size:.88em;letter-spacing:.02em}
.ic{width:18px;height:18px;flex:none}
.wordmark{display:inline-flex;align-items:center;gap:8px;font-weight:900;font-size:17px;letter-spacing:.04em;text-decoration:none;color:#17181A;min-height:44px}
.wordmark i{width:11px;height:11px;background:#C8311F;border-radius:2px;display:inline-block}
.nav{display:flex;gap:20px}
.nav a{display:inline-flex;align-items:center;min-height:44px;font-weight:700;font-size:15px;text-decoration:none;color:#6E7177;border-bottom:3px solid transparent}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:4px;border:1.5px solid #17181A;background:#17181A;color:#F2F1EC;font:inherit;font-weight:700;cursor:pointer;text-decoration:none;box-sizing:border-box;white-space:nowrap}
.btn.line{background:transparent;color:#17181A}
.btn.plain{border-color:transparent;background:transparent;color:#4A4D52;font-weight:500}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
.who{display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:#17181A;min-height:44px;font-weight:700;font-size:14px}
.avatar{width:32px;height:32px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex:none;box-sizing:border-box}
.avatar.guest{background:transparent;border:1.5px dashed #6E7177}
.sheet{background:#FFFFFF;border-top:3px solid #17181A;padding:20px;box-sizing:border-box}
.sil{height:12px;background:#E6E4DD;border-radius:2px}
.stamp{display:inline-block;padding:8px 16px;border:3px solid #C8311F;border-radius:6px;color:#C8311F;font-weight:900;font-size:22px;letter-spacing:.16em;line-height:1.2;transform:rotate(-7deg);box-shadow:inset 0 0 0 3px #FFFFFF,inset 0 0 0 4px #C8311F;background:rgba(255,255,255,.9);white-space:nowrap}
details summary{cursor:pointer;font-size:13px;font-weight:700;color:#6E7177;min-height:36px;display:inline-flex;align-items:center;gap:4px;letter-spacing:.06em}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; display: flex; flex-direction: column; background: #F2F1EC; padding: 12px 20px 0">
<header style="display: flex; flex-direction: column">
  <div style="display: flex; align-items: center; justify-content: space-between">
    <a class="wordmark" href="post-list-anonymous.html"><i></i>Nyxis 掲示板</a>
    <a class="who" href="me.html" aria-label="いまはゲストです"><span class="avatar guest"></span>ゲスト</a>
  </div>
  <div style="display: flex; align-items: center; justify-content: space-between">
    <nav class="nav" aria-label="メニュー"><a href="post-list-anonymous.html">ホーム</a></nav>
    <a class="btn sm" href="login.html">Googleでログイン</a>
  </div>
  <div style="border-top: 3px solid #17181A"></div>
</header>
<main style="flex: 1; overflow: hidden; display: flex; flex-direction: column; gap: 18px; padding-top: 8px">
  <a class="btn plain sm" href="post-list-anonymous.html" style="align-self: flex-start; padding-left: 0">
    <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
    ホーム
  </a>
  <section class="sheet" role="alert" aria-labelledby="deny-title" style="position: relative; display: flex; flex-direction: column; gap: 12px; min-height: 230px; overflow: hidden">
    <div class="sil" style="width: 70%; height: 24px" aria-hidden="true"></div>
    <div style="display: flex; flex-direction: column; gap: 10px; border-top: 1px solid #D6D4CC; padding-top: 14px" aria-hidden="true">
      <div class="sil" style="width: 96%"></div>
      <div class="sil" style="width: 84%"></div>
      <div class="sil" style="width: 60%"></div>
      <div class="sil" style="width: 90%; margin-top: 8px"></div>
      <div class="sil" style="width: 40%"></div>
    </div>
    <div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center">
      <h1 id="deny-title" class="stamp">見られません</h1>
    </div>
  </section>
  <p style="font-size: 17px; font-weight: 700; line-height: 1.5">存在しないか、下書きです。下書きは、書いた人と管理者だけが見られます。</p>
  <div style="display: flex; flex-direction: column; gap: 8px">
    <a class="btn" href="login.html">Googleでログイン</a>
    <a class="btn line" href="post-list-anonymous.html">ホームにもどる</a>
  </div>
  <details>
    <summary>
      <svg class="ic" style="width: 14px; height: 14px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
      くわしく
    </summary>
    <p class="mono" style="font-size: 12px; color: #6E7177; padding: 4px 0 0 18px">403 · readPost · read-draft-post</p>
  </details>
</main>
</div>
</body>
</html>
