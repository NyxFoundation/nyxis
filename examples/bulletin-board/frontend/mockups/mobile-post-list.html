<!doctype html>

<style>
body{margin:0;background:#F2F1EC;color:#17181A;font-family:"Zen Kaku Gothic New","Hiragino Sans",system-ui,sans-serif;font-size:16px;line-height:1.7}
a{color:#17181A}
h1,h2,h3,p{margin:0}
.mono{font-family:"DM Mono",ui-monospace,Menlo,monospace;font-size:.88em;letter-spacing:.02em}
.ic{width:18px;height:18px;flex:none}
.wordmark{display:inline-flex;align-items:center;gap:8px;font-weight:900;font-size:17px;letter-spacing:.04em;text-decoration:none;color:#17181A;min-height:44px}
.wordmark i{width:11px;height:11px;background:#C8311F;border-radius:2px;display:inline-block}
.nav{display:flex;gap:20px}
.nav a{display:inline-flex;align-items:center;min-height:44px;font-weight:700;font-size:15px;text-decoration:none;color:#6E7177;border-bottom:3px solid transparent}
.nav a.on{color:#17181A;border-bottom-color:#17181A}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:4px;border:1.5px solid #17181A;background:#17181A;color:#F2F1EC;font:inherit;font-weight:700;cursor:pointer;text-decoration:none;box-sizing:border-box;white-space:nowrap}
.btn.line{background:transparent;color:#17181A}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
.tag{display:inline-flex;align-items:center;height:22px;padding:0 7px;border:1.5px solid currentColor;border-radius:2px;font-size:12px;font-weight:700;line-height:1;letter-spacing:.08em;white-space:nowrap}
.tag.pub{color:#1F7A3E}
.tag.draft{color:#6E7177;border-style:dashed}
.tag.me{color:#2851A3}
.avatar{width:32px;height:32px;border-radius:50%;background:#17181A;color:#F2F1EC;display:inline-flex;align-items:center;justify-content:center;font-family:"DM Mono",ui-monospace,Menlo,monospace;font-size:13px;flex:none;box-sizing:border-box;text-decoration:none}
.list{border-bottom:1px solid #D6D4CC}
.row{display:flex;flex-direction:column;gap:6px;padding:16px 0;border-top:1px solid #D6D4CC}
.row .top{display:flex;align-items:baseline;gap:10px}
.row .num{font-family:"DM Mono",ui-monospace,Menlo,monospace;font-size:12px;color:#6E7177}
.row .title{font-size:18px;font-weight:700;text-decoration:none;color:#17181A;line-height:1.4}
.row.draft .title{color:#4A4D52}
.row .excerpt{color:#4A4D52;font-size:14px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.row .tags{display:flex;gap:6px;align-items:center}
.input{font:inherit;min-height:48px;padding:10px 0;border:0;border-bottom:1.5px solid #17181A;background:transparent;width:100%;box-sizing:border-box;color:#17181A;border-radius:0}
.input::placeholder{color:#B3B5B8}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; display: flex; flex-direction: column; background: #F2F1EC; padding: 12px 20px 0">

  <div style="display: flex; align-items: center; justify-content: space-between">

</header>
<main style="flex: 1; overflow: hidden; display: flex; flex-direction: column; gap: 20px; padding-top: 24px">
  <div style="display: flex; align-items: baseline; gap: 12px">
    <h1 style="font-size: 30px; font-weight: 900; line-height: 1.2">Home</h1>
    <span class="mono" style="color: #6E7177">3</span>
    <a class="btn sm" href="post-create.html" style="margin-left: auto">New post</a>
  </div>
  <div class="list">
    <article class="row draft">
      <div class="top"><span class="num">01</span><a class="title" href="post-detail-author.html">Next release announcement</a></div>
      <div class="tags"><span class="tag draft">Draft</span><span class="tag me">You</span></div>

    <article class="row">

      <p class="excerpt">On this board, only people allowed to view can view.</p>
    </article>
    <article class="row">
      <div class="top"><span class="num">03</span><a class="title" href="post-detail-author.html">How to read the rules</a></div>
      <div class="tags"><span class="tag pub">Published</span><span class="tag me">You</span></div>
      <p class="excerpt">Anything not written down is not allowed.</p>
    </article>
  </div>
  <form style="display: flex; align-items: flex-end; gap: 10px">
    <div style="flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0">
      <label for="open-id" style="font-size: 12px; font-weight: 700; letter-spacing: .1em; color: #6E7177">Open by ID</label>
      <input class="input mono" id="open-id" type="text" placeholder="Post ID">
    </div>
    <button class="btn line" type="button">Open</button>
  </form>
</main>
</div>
</body>
</html>
